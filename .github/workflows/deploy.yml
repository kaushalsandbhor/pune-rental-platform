
name: Deploy TenantLords Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/rental-api/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest GitHub code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/rental-api/pom.xml

      # 3. Build Spring Boot JAR
      - name: Build Spring Boot application
        working-directory: backend/rental-api
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 4. Find the executable JAR
      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find backend/rental-api/target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*.original' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No executable JAR found!"
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      # 5. Configure SSH
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/tenantlords.pem
          chmod 600 ~/.ssh/tenantlords.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 6. Upload JAR to EC2
      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/tenantlords.pem \
            "${{ steps.jar.outputs.path }}" \
            "$EC2_USER@$EC2_HOST:/opt/tenantlords/app.jar.new"

      # 7. Replace old JAR and restart backend
      - name: Deploy and restart backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/tenantlords.pem "$EC2_USER@$EC2_HOST" \
            "mv /opt/tenantlords/app.jar.new /opt/tenantlords/app.jar && sudo systemctl restart tenantlords && sudo systemctl is-active tenantlords"

      # 8. Clean up private SSH key
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/tenantlords.pem
