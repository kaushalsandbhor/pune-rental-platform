
<div class="register-container" >

  <div class="register-card">

    <h1>Create Landlord Account</h1>
    <p class="subtitle">Register to manage your rental properties</p>

    <form (submit)="$event.preventDefault(); onRegister()">

      <div class="form-group">
        <label>Full Name *</label>
        <input
          type="text"
          [value]="fullName()"
          (input)="fullName.set($any($event.target).value)"
          placeholder="Enter your full name"
        />
      </div>

      <div class="form-group">
        <label>Username *</label>
        <input
          type="text"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
          placeholder="Choose a username"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input
          type="tel"
          [value]="mobile()"
          (input)="mobile.set($any($event.target).value)"
          placeholder="Enter your mobile number"
        />
      </div>

      <p class="hint">At least one of email or mobile is required.</p>

      <div class="form-group">
        <label>Password *</label>
        <input
          type="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          placeholder="Create a password"
        />
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      @if (successMessage()) {
        <p class="success">{{ successMessage() }}</p>
      }

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Creating account...' : 'Register' }}
      </button>

    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>

</div>
