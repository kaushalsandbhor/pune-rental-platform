<div class="login-container">

  <div class="login-card">

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to manage your rental properties</p>

    <form (submit)="$event.preventDefault(); onLogin()">

      <div class="form-group">
        <label>Username / Email / Mobile</label>

        <input type="text" [value]="identifier()" (input)="identifier.set($any($event.target).value)"
          placeholder="Enter your username, email or mobile" />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input type="password" [value]="password()" (input)="password.set($any($event.target).value)"
          placeholder="Enter your password" />
      </div>

      @if (errorMessage()) {
      <p class="error">
        {{ errorMessage() }}
      </p>
      }

      <button type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Logging in...' : 'Login' }}
      </button>

      <button  (click)="onLogout()">
        Logout
      </button>


    </form>



    <p class="login-link">
      Not registered?
      <a routerLink="/register">Create an account</a>
    </p>

  </div>

</div>
